version: 2
updates:
- package-ecosystem: docker
  directory: /
  schedule:
    interval: daily
  cooldown:
    default-days: 7

- package-ecosystem: gomod
  directory: /
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  groups:
    gomod:
      patterns:
        - "*"

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  groups:
    github-actions:
      patterns:
        - "*"
